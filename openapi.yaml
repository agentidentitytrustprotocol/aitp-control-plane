openapi: 3.1.0
info:
  title: AITP Control Plane API
  version: 0.1.0
  description: |
    Registry, audit log, revocation list, and webhook fan-out for an AITP
    (Agent Identity Trust Protocol) deployment. See README.md and
    docs/api.md for the prose reference.

    Rate limiting: every `/api/*` route except `/api/health`, `/api/readyz`,
    and `/api/metrics` may return `429 RATE_LIMITED` with `Retry-After` and
    `X-RateLimit-*` headers. The per-path `429` responses below are only
    spelled out where limits are most likely to be hit (enrollment). The
    `/.well-known/*` paths are rewrites that bypass the request gate: they are
    never rate-limited and carry no `x-request-id` or CORS headers.

    Authentication: routes without `security: []` (or the enrollment-token
    scheme) require an API key. The gate answers `401 INVALID_API_KEY` for a
    missing or unknown key, and in production `503 SERVER_MISCONFIGURED` when
    `API_KEYS` is empty; in non-production an empty `API_KEYS` disables the
    check.

    Idempotency: a replayed `Idempotency-Key` response carries
    `Idempotency-Replayed: true`. See docs/api.md#idempotency.
  license:
    name: See LICENSE

servers:
  - url: http://localhost:4000
    description: Local dev
  - url: https://control-plane.example.com
    description: Production placeholder

tags:
  - name: discovery
    description: Public unauth endpoints (manifest, revocation list, health, metrics)
  - name: registry
    description: Agent enrollment and discovery
  - name: events
    description: Telemetry ingestion and query
  - name: sessions
    description: Handshake session records
  - name: revocation
    description: TCT revocation
  - name: webhooks
    description: Outbound delivery subscriptions
  - name: audit
    description: Admin audit log
  - name: dashboard
    description: Aggregated JSON for consumers
  - name: tcts
    description: Observed TCTs (projected from handshake events)
  - name: delegations
    description: Observed delegation chains
  - name: trust
    description: OIDC trust anchors and pinned-key allowlist

security:
  - apiKey: []

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        API key from the `API_KEYS` env allowlist. Required on every route that
        does not override `security`. In non-production an empty `API_KEYS`
        disables the check; in production it makes gated routes answer `503
        SERVER_MISCONFIGURED`.
    enrollmentToken:
      type: http
      scheme: bearer
      description: One-time bearer issued by `POST /api/registry/enroll`. Used only on `POST /api/registry/agents`.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: >-
        Opaque client-chosen key, scoped to the endpoint. Replaying the same key
        returns the stored response (with `Idempotency-Replayed: true`) without
        re-running the handler — even if the body differs. Only `200`, `201`,
        `202`, `204`, `400`, `409` and `422` are stored. An empty key, one over
        255 characters, or one containing control characters is `400
        IDEMPOTENCY_KEY_INVALID`.
    namespace:
      name: namespace
      in: query
      required: false
      schema:
        type: string
      description: Tenant scope filter. Omitting it returns rows across all namespaces.
    requestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
      description: Client-supplied request correlation ID. Echoed on the response.

  responses:
    IdInvalid:
      description: >-
        `code` is `ID_INVALID` — the `{id}` path segment is not a UUID. The
        check is syntax-only (canonical hyphenated 8-4-4-4-12 hex, any version,
        either case) and runs before the database or service is touched.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >-
        `code` is `INVALID_API_KEY` — the request gate found no API key, or one
        not in `API_KEYS`. Returned before the handler runs. Not returned in
        non-production when `API_KEYS` is empty.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GateMisconfigured:
      description: >-
        `code` is `SERVER_MISCONFIGURED` — production server with an empty
        `API_KEYS`; every gated route fails closed. Returned by the request gate
        before the handler runs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      description: >-
        `code` is this service's own machine code; branch on it, not on
        `error`. Some values share a name with the AITP error-code registry
        (https://github.com/agentidentitytrustprotocol/agentidentitytrustprotocol/blob/main/registries/error-codes.md)
        without being bound by it — e.g. the CP's `MANIFEST_INVALID` covers any
        enrollment-time manifest rejection, broader than the registry's
        schema-validation meaning.
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    ManifestVerificationError:
      description: >-
        The `400` body of `POST /api/registry/enroll`. Composed from `Error` so
        the two cannot drift, plus an optional `verifyCode` carrying the `aitp`
        SDK's own machine-readable reason.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            verifyCode:
              type: string
              example: signature_invalid
              description: >-
                Why manifest verification failed, as classified by the `aitp`
                SDK. Present if and only if the SDK rejected the manifest. It is
                absent whenever one of the control plane's own guards rejected it
                instead — a `manifest.aid` that is missing or does not start with
                `aid:`, or an `expires_at` inside the 5-minute registration
                window, both of which run *after* the SDK has already accepted
                the manifest — and absent on the pre-validation failures that
                never reach the SDK at all.


                **Branch on this field, not on `error`.** The SDK states that
                the code is the contract and the message wording is not, so
                `error` may be reworded in any SDK release and must be treated
                as human-facing detail only.


                Because of that, a `code` of `MANIFEST_EXPIRED` may arrive
                either with `verifyCode: expired` (the manifest was already past
                `expires_at`, so the SDK rejected it) or with no `verifyCode` at
                all (it was still valid but expires inside the 5-minute
                registration window, so this service rejected it). Both mean
                "re-issue with a longer TTL", which is why they share one `code`;
                `verifyCode` is what distinguishes them if you need to.


                The value set is owned by the `aitp` SDK's `verifyManifestJson`
                (listed at
                https://github.com/agentidentitytrustprotocol/aitp-rs/blob/main/docs/sdk-node.md#manifest-verification;
                verified against `aitp` `^0.13.1`). It is deliberately not an
                `enum`: a new SDK release may add values, which this service
                passes through verbatim. Treat any unrecognized value as a
                generic "manifest verification failed".

    RateLimitError:
      description: >-
        The `429` body from the request gate. `bucket` names which limiter
        tripped, so a client can tell a per-IP limit from a per-key one and back
        off against the right dimension. See the `Retry-After`,
        `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`
        response headers for when to retry.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            bucket:
              type: string
              example: enroll-ip
              description: >-
                The rate-limit bucket that rejected the request. Currently
                `enroll-ip` (strict, per-IP), `public-ip` (per-IP) or `api-key`
                (per-key); like `verifyCode`, not an `enum` — buckets are an
                internal partitioning this service may re-cut.

    PayloadTooLargeError:
      description: >-
        The `413` body of `POST /api/events`. Composed from `Error` — same
        pattern as `RateLimitError` — plus an optional `eventType` naming the
        single event that blew the cap.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            eventType:
              type: string
              example: handshake.complete
              description: >-
                The `type` of the one event whose `payload` exceeded the
                per-event cap.


                **Present on exactly one of the four `413` paths.** The route
                rejects a batch for four distinct reasons, all carrying
                `code: PAYLOAD_TOO_LARGE`: a declared `Content-Length` over the
                batch byte cap, an actual streamed body over that same cap
                (checked on the bytes, because `Content-Length` is spoofable
                and omittable under chunked encoding), more events in one batch
                than the event-count ceiling, and a single event's `payload`
                over the per-event byte cap. Only the last of those can name an
                offender, so only it sets this field.


                Its absence therefore means "the whole batch was too big, no
                one event is to blame" — not "we do not know which". That
                follows the rule `docs/api.md` states for every optional
                machine-readable detail field on this API: absent means "not
                applicable here", never "unknown".


                Note the batch is rejected whole either way. Partial acceptance
                would force the caller to reconcile which events landed, which
                defeats the point of batching, so `eventType` is a diagnostic
                pointing at what to shrink — not a report of what was dropped
                from an otherwise-successful ingest.

    ReadinessFailure:
      description: >-
        The `503` body of `GET /api/readyz`. Deliberately **not** composed from
        `Error` and deliberately not carrying a `code`: this is a Kubernetes-style
        probe response consumed by a load balancer, not an API error handed to a
        client that would branch on a machine code. Declaring `Error` here would
        either misdescribe the route or force a `code` into it that nothing reads.


        **A `503` always carries exactly `reason`.** `shutting_down` is a
        deliberate drain; `db_unreachable` is a failed database probe. There is
        no second field to branch on. The raw exception message is never put in
        the body (it is logged server-side), because this route is unauthenticated
        and unthrottled.
      type: object
      required: [ready, reason]
      properties:
        ready:
          type: boolean
          const: false
          description: >-
            Always `false` on a `503`, and always `true` on the `200`. A probe
            may key off this field alone and ignore the rest of the body.
        reason:
          type: string
          example: shutting_down
          description: >-
            Why the instance is not ready, as a classification and never as
            exception text. Present on every `503`. Currently:

            - `shutting_down` — a `SIGTERM` has been received and the LB should
              drain this pod, which stays *running* (`/api/health` deliberately
              keeps answering `200` through the drain; only readiness flips).
            - `db_unreachable` — the database `SELECT 1` failed. The underlying
              error is logged, not returned.


            Not an `enum`, and this one is expected to grow. Treat an
            unrecognised `reason` as "not ready, for a reason this client need
            not understand" — that is what made adding `db_unreachable` a
            non-breaking extension.

    HealthFailure:
      description: >-
        The `503` body of `GET /api/health`. Like `ReadinessFailure`, deliberately
        **not** composed from `Error` and deliberately carrying no `code`: it is a
        probe response read by an orchestrator, not an API error handed to a client
        that would branch on a machine code.


        Exactly one condition produces it — the database ping failed — so a `503`
        here means "process up, database unreachable". It is *not* a drain signal:
        this route never consults the shutdown flag that flips `/api/readyz`, so
        it keeps answering `200` for as long as the process is alive and the
        database is reachable. This repo points its platform healthcheck at
        `/api/health` (`railway.json`); Railway calls it only while a new
        deployment starts, so a `503` here fails that deploy (the previous one
        keeps serving) and never restarts a service that is already running.
        On an orchestrator that restarts on failed liveness (e.g. a Kubernetes
        `livenessProbe`), however, a database outage turns this probe `503` on
        every replica and restarts healthy processes — prefer a TCP check there.
        The drain case belongs to `/api/readyz` alone.


        The `200` body is these same four fields with `ok: true` and `db: ok` — one
        object literal, built before the status is chosen — so a probe may key off
        `ok` (or the status) alone and ignore the rest. The `200` is not declared
        separately for the same reason `/api/readyz`'s is not: the schema
        requirement this file holds itself to is about error responses.
      type: object
      required: [ok, service, aid, db]
      properties:
        ok:
          type: boolean
          const: false
          description: Always `false` on a `503`, and always `true` on the `200`.
        service:
          type: string
          const: aitp-control-plane
          description: >-
            Constant service identifier, so a shared or proxied probe path makes it
            obvious which service answered.
        aid:
          type: string
          example: "aid:pubkey:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"
          description: >-
            The control plane's own AID, read from its in-process identity (the
            manifest is not built or signed for a probe). Present on the `503`
            too: it comes from process-local identity rather than from a query, so
            a database outage does not remove it. (This is also the one probe that
            touches CP identity at all — `/api/readyz` does not; a usable
            `CP_AID_SEED_HEX` is enforced at boot in production.)
        db:
          type: string
          const: error
          description: >-
            Always `error` on a `503` and `ok` on the `200`. The database ping is
            the only check this probe makes, which is why it is the only field that
            can disagree with `ok`.

    AgentSummary:
      description: >-
        The body of `GET /api/registry/agents/{aid}` — a subset of `Agent`
        (no `namespace`, `lastEnrolledAt`, `agentManifestHint` or
        `manifestJson`). Use `GET /api/registry/agents?aid=` for the full record.
      type: object
      required: [aid, displayName, handshakeEndpoint, offeredCaps, status, manifestUrl]
      properties:
        aid: { type: string, example: "aid:pubkey:ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo" }
        displayName: { type: string }
        handshakeEndpoint: { type: string, format: uri }
        offeredCaps:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, expired, deregistered]
        registeredAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        manifestUrl: { type: string }

    Agent:
      type: object
      required: [aid, displayName, handshakeEndpoint, offeredCaps, status]
      properties:
        aid: { type: string, example: "aid:pubkey:ed25519:11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo" }
        displayName: { type: string }
        handshakeEndpoint: { type: string, format: uri }
        offeredCaps:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, expired, deregistered]
        namespace: { type: string, default: default }
        registeredAt: { type: string, format: date-time }
        lastEnrolledAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        manifestUrl: { type: string }
        agentManifestHint: { type: string, nullable: true }
        manifestJson:
          type: string
          description: Inline ManifestEnvelope JSON. Present only when `?include_manifest=true`.

    EnrollResponse:
      type: object
      required: [token, expiresIn, aid]
      properties:
        token: { type: string }
        expiresIn: { type: integer, example: 300 }
        aid: { type: string }

    RegisterResponse:
      type: object
      required: [aid, displayName, registeredAt]
      properties:
        aid: { type: string }
        displayName:
          type: string
          description: "`manifest.display_name`, or the AID when absent."
        registeredAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [id, type, ts]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          example: handshake.complete
          description: "Examples: agent.registered, agent.expired, agent.deregistered, handshake.started, handshake.complete, handshake.failed, tct.revoked, delegation.issued, delegation.redeemed"
        ts: { type: string, format: date-time }
        aidA: { type: string, nullable: true }
        aidB: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        grants:
          type: array
          items: { type: string }
        payload: { type: object, additionalProperties: true }
        source: { type: string, nullable: true }

    EventIngestItem:
      description: >-
        One event as submitted to `POST /api/events`. No field is required;
        the server normalizes each item (full rules: docs/events.md#ingest-normalization).
        The server always assigns the stored `id` (a client-supplied `id` is
        never used as the id; it is just part of the content). Recipe v1: an
        item with a valid `ts` gets a deterministic UUID (RFC 9562 version 8)
        derived from SHA-256 over the tag `aitp-event:v1`, a fingerprint of the
        caller's bearer token, and the item exactly as received in canonical
        JSON (keys sorted — key order is irrelevant); an item without a valid
        `ts` gets a random id. So the same producer re-sending the same event
        is recognised as a duplicate (`EventIngestResponse.duplicates`): stored,
        streamed and delivered to webhooks once; different API keys never
        collide (callers sending no key share one fingerprint). Two distinct
        events with identical content and `ts` from one key are merged — add a
        distinguishing field to genuinely repeated events. Caveats: the SSE publish and webhook enqueue follow the INSERT,
        so a crash between them loses that event's fan-out for good (a re-send
        is then a duplicate) — at-most-once in that window; and an event
        re-sent after the retention sweep deleted its row is stored again
        (docs/events.md#event-ids-and-de-duplication). Items that are not JSON objects are
        skipped silently (not counted in `dropped`). After normalization an
        item is DROPPED (reported in `EventIngestResponse.dropped`/`errors`,
        the rest of the batch still ingested) when a text field exceeds its
        `maxLength` (Unicode code points, applied to the normalized field
        whichever alias carried it), when any text field, `grants` entry, or
        key or string value anywhere in `payload` contains U+0000, when any
        `grants` entry or key or string value anywhere in `payload` contains a
        lone (unpaired) UTF-16 surrogate such as `"\ud800"` — jsonb cannot
        store one — or when `payload` is nested more than 64 levels deep
        (docs/events.md#per-item-limits). When `payload` is absent the whole
        event is the payload, so these payload rules then cover every field.
        Reasons per field: `<field> must not contain a NUL character` (text
        fields), `<field> contains a NUL character` / `<field> contains a lone
        UTF-16 surrogate` (`grants`, `payload`), `<field> exceeds <n>
        character limit`, `payload is nested too deep (more than 64 levels)`.
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          maxLength: 128
          description: Defaults to `unknown` when absent or not a string. No NUL.
        ts:
          description: >-
            ISO-8601 string, or a number of epoch seconds (values below 1e12)
            or milliseconds. Defaults to the time of ingest when absent,
            unparseable, or out of range (a number beyond +-8.64e15 ms, or a
            value that renders outside years 0001-9999) — never a drop.
          oneOf:
            - { type: string }
            - { type: number }
        aidA: { type: string, maxLength: 512, description: "Aliases: `aid_a`, `initiator`. No NUL." }
        aidB: { type: string, maxLength: 512, description: "Aliases: `aid_b`, `target`. No NUL." }
        sessionId: { type: string, maxLength: 255, description: "Alias: `session_id`. No NUL." }
        runId: { type: string, maxLength: 255, description: "Aliases: `run_id`, `playground.run_id`. No NUL." }
        grants:
          type: array
          items: { type: string }
          description: >-
            Ignored unless an array of strings. No entry may contain NUL or a
            lone UTF-16 surrogate.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Stored verbatim. When absent (or not an object), the whole raw
            event object is stored as the payload. Serialized size is capped
            at 65,536 characters (UTF-16 code units of `JSON.stringify`, not
            bytes; over it the whole batch is `413`). No key or string value
            may contain NUL or a lone UTF-16 surrogate (well-formed surrogate
            pairs — emoji and other astral characters — are fine), and nesting
            is limited to 64 levels (the item is dropped otherwise).
        source:
          type: string
          maxLength: 128
          description: Defaults to `playground`. No NUL.

    EventIngestRequest:
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/EventIngestItem" }
        - type: object
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/EventIngestItem" }

    EventIngestResponse:
      type: object
      required: [ingested, dropped, errors, inserted, duplicates]
      properties:
        ingested:
          type: integer
          description: >-
            Items that passed per-item validation and were handed to the event
            store. Non-object items and dropped items are not counted. Always
            `inserted + duplicates`.
        inserted:
          type: integer
          description: >-
            Of `ingested`, the events newly stored by this request. Only these
            are published to `GET /api/events/stream` and dispatched to
            webhooks. Always present.
        duplicates:
          type: integer
          description: >-
            Of `ingested`, the events whose content-derived id was already
            stored, or that repeated an earlier item of the same batch (see
            `EventIngestItem`). Not stored, streamed or delivered again; still
            run through the (idempotent) session/TCT projections. Always
            present (0 when none).
        dropped:
          type: integer
          description: >-
            Object items refused by per-item validation (see
            `EventIngestItem`). Always present (0 when none).
        errors:
          type: array
          maxItems: 20
          description: >-
            One entry per dropped item, at most 20 (`dropped` is the full
            count). Always present (empty when none). Replayed unchanged
            under the same `Idempotency-Key`.
          items:
            type: object
            required: [index, field, reason]
            properties:
              index:
                type: integer
                description: Position of the item in the submitted array (non-object items counted).
              field:
                type: string
                enum: [type, aidA, aidB, sessionId, runId, source, grants, payload]
                description: The normalized field that failed.
              reason:
                type: string
                description: Human prose; never echoes the submitted value. Do not parse.

    SessionDetail:
      type: object
      required: [session, events]
      properties:
        session: { $ref: "#/components/schemas/HandshakeSession" }
        events:
          type: array
          description: The session's stored events, oldest first.
          items: { $ref: "#/components/schemas/AuditEvent" }

    HandshakeSession:
      type: object
      required: [sessionId, status]
      properties:
        sessionId: { type: string }
        aidA: { type: string, nullable: true }
        aidB: { type: string, nullable: true }
        status:
          type: string
          enum: [started, complete, failed]
        grants:
          type: array
          items: { type: string }
        runId: { type: string, nullable: true }
        boundary: { type: string, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RevocationEntryRequest:
      type: object
      required: [jti]
      properties:
        jti:
          type: string
          format: uuid
          description: RFC 4122 UUID, versions 1–5 only (v6/v7/v8 are `400 JTI_INVALID`).
        reason:
          type: string
          maxLength: 500
          description: >-
            Free-form operator note. Must not contain a NUL (U+0000) — that is
            the one code point neither the `reason` column nor the `jsonb` audit
            payload can store, and it is rejected `400 BODY_INVALID`. Other
            control characters (newline, tab) are fine. Not expressible in JSON
            Schema, hence the prose.
        revokedAt:
          type: string
          format: date-time
          description: >-
            Defaults to now; a non-string value is ignored (treated as
            absent). Must fall between `1970-01-01T00:00:00.000Z` and
            `9999-12-31T23:59:59.999Z`, or `400 BODY_INVALID`. The two ends have
            different reasons: above the upper bound the value is not a writable
            `timestamp with time zone` at all, while below the epoch it is
            storable but cannot be republished faithfully, since the signed
            revocation list carries `revoked_at` as seconds since that epoch. The
            bound applies to the UTC instant, not to the digits sent, so
            `1970-01-01T00:00:00+01:00` is `1969-12-31T23:00Z` and is rejected.
            RFC 3339 `date-time` already forbids the expanded-year forms
            (`+010000-…`), so a spec-validating client is constrained before it
            reaches the server.

    RevocationEntryResponse:
      description: >-
        Echoes the values of this request. When the `jti` was already revoked,
        the stored entry keeps its original `revoked_at` and `reason`; this
        body still reports the values just sent.
      type: object
      required: [jti, revokedAt, reason]
      properties:
        jti: { type: string, format: uuid }
        revokedAt: { type: string, format: date-time }
        reason: { type: string, nullable: true }

    AdminAuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, example: revocation.add }
        actorId: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Action-specific context. Never carries a webhook secret: a
            `webhook.update` that sets it records `secretRotated: true`.
        requestId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Webhook:
      description: A subscription as listed. The `secret` is never included.
      type: object
      required: [id, url, events, active]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookCreated:
      description: >-
        The `201` body of `POST /api/webhooks` — the only response that ever
        returns the `secret` (server-generated when the request omitted it).
      type: object
      required: [id, url, events, secret, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        secret: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    WebhookCreateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: http(s); https only in production. Must pass the SSRF guard and `WEBHOOK_URL_ALLOWLIST`.
        events:
          type: array
          items: { type: string }
          description: >-
            Empty or omitted means "all deliverable event types". Non-string
            entries are dropped; a string entry containing a NUL (U+0000) is
            `400 BODY_INVALID`.
        secret:
          type: string
          maxLength: 255
          description: >-
            HMAC key for `X-Aitp-Signature`. Server-generated when omitted. At
            most 255 characters (Unicode code points; the column is
            varchar(255)) and no NUL (U+0000), else `400 BODY_INVALID`.
        active: { type: boolean, default: true }

    WebhookUpdateRequest:
      description: >-
        Every field optional; only the fields present (with the right type) are
        applied. Same storability limits as `WebhookCreateRequest`. A changed
        `secret` is recorded in the admin audit log as `secretRotated: true`,
        never by value.
      type: object
      properties:
        url: { type: string, format: uri, description: "No NUL (U+0000)." }
        events:
          type: array
          items: { type: string }
          description: Non-string entries are dropped; no NUL (U+0000) in a string entry.
        secret: { type: string, maxLength: 255, description: "At most 255 code points; no NUL (U+0000)." }
        active: { type: boolean }

    WebhookUpdated:
      type: object
      required: [id, url, events, active, updatedAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }

    IssuedTct:
      type: object
      description: >-
        A TCT observed by the control plane. Fields are the decomposed,
        format-agnostic projection of a reported `tct.issued` event. As of
        aitp/0.2 (JWS TCT migration) the source claims use JWT names —
        `issuer`/`subject`/`audience` derive from the `iss`/`sub`/`aud`
        claims — but the response shape here is unchanged.
      required: [jti, issuer, subject, audience, grants, issuedAt, revoked]
      properties:
        jti: { type: string, format: uuid }
        issuer: { type: string }
        subject: { type: string }
        audience: { type: string }
        grants:
          type: array
          items: { type: string }
        bindingCnf:
          type: string
          nullable: true
          description: >-
            Key-binding confirmation scalar. In aitp/0.2 this is the
            subject key's RFC 7638 JWK thumbprint (the `cnf.jkt` claim);
            in aitp/0.1 it was the subject's raw public key (`binding.cnf`).
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        sessionId: { type: string, nullable: true }
        revoked: { type: boolean }
        revokedAt: { type: string, format: date-time, nullable: true }

    Delegation:
      type: object
      description: >-
        A parent → child delegation observed by the control plane.
        `parentJti` is taken from an explicit event field, then the reported
        claims, then the embedded grant voucher's `src_jti`; a single-hop
        token without a `jti` gets a deterministic synthetic UUIDv5. Full
        derivation: docs/events.md#tct--delegation-projection.
      required: [jti, parentJti, delegator, delegatee, scope, issuedAt, revoked]
      properties:
        jti: { type: string, format: uuid }
        parentJti: { type: string, format: uuid }
        delegator: { type: string }
        delegatee: { type: string }
        scope:
          type: array
          items: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedReason: { type: string, nullable: true, enum: [explicit, parent_revoked, null] }

    TrustAnchor:
      description: >-
        `addedBy` is returned by the list and create routes only; the
        single-anchor GET and PATCH omit it.
      type: object
      required: [id, namespace, issuerUrl]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, default: default }
        issuerUrl: { type: string, format: uri }
        jwksUrl: { type: string, format: uri, nullable: true }
        jwksCachedAt: { type: string, format: date-time, nullable: true }
        label: { type: string, nullable: true }
        addedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TrustAnchorCreateRequest:
      description: >-
        Lengths are Unicode code points. No string field may contain a NUL
        (U+0000). Any violation is `400 BODY_INVALID`.
      type: object
      required: [issuerUrl]
      properties:
        namespace:
          type: string
          maxLength: 128
          default: default
          description: An empty string or non-string means `default`.
        issuerUrl:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Must start with `http://` or `https://`. At most 2048 characters
            and 2048 UTF-8 bytes (it is part of a unique index whose row limit
            is in bytes).
        jwksUrl:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            When non-empty, must start with `http://` or `https://`. An empty
            string means "none" (OIDC discovery) and is stored as `null`.
        label: { type: string, maxLength: 128 }

    PinnedKey:
      type: object
      required: [namespace, aid, pubkey]
      properties:
        namespace: { type: string }
        aid: { type: string }
        pubkey:
          type: string
          description: Ed25519 public key, 43-character base64url
          pattern: ^[A-Za-z0-9_-]{43}$
        label: { type: string, nullable: true }
        addedBy: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CircuitBreakerSnapshot:
      type: object
      required: [state, failures, consecutiveSuccesses]
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        failures: { type: integer }
        consecutiveSuccesses: { type: integer }
        openedAt: { type: integer, nullable: true, description: Unix ms when the breaker last opened }
        nextProbeAt: { type: integer, nullable: true, description: Unix ms when the next half_open probe is allowed }

paths:
  /api/health:
    get:
      tags: [discovery]
      summary: Health probe (process up + DB ping + CP AID)
      description: >-
        `200 {ok: true, service, aid, db: "ok"}` while the database answers
        `SELECT 1`, `503` (`HealthFailure`) when it does not. Used as Railway's
        deploy-time healthcheck (`railway.json`), which gates a new deployment
        and is never polled afterwards, so it never restarts a running service.
        Not suitable as a restart-triggering liveness probe (e.g. Kubernetes
        `livenessProbe`): a database outage would restart every replica.
      security: []
      responses:
        "200": { description: OK }
        "503":
          description: >-
            The database ping failed. The process itself is up — that is what this
            probe reports — so this is "up, but cannot serve anything that needs the
            database", not a crashed instance.


            The body is **not** the shared `Error` shape and carries no `code` —
            see `HealthFailure` for why, and for the `200`'s shape, which is the
            same four fields.


            Unlike `/api/readyz`, this route does not consult the shutdown flag, so
            a drain never produces a `503` here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthFailure" }

  /api/readyz:
    get:
      tags: [discovery]
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Ready }
        "503":
          description: >-
            Not ready, for one of two reasons: a `SIGTERM` has been received and
            this instance is draining itself out of rotation
            (`reason: shutting_down`), or the database ping failed
            (`reason: db_unreachable`). `reason` is present on every `503`; the
            database's own error message is logged server-side and never
            returned.


            The body is **not** the shared `Error` shape and carries no `code` —
            see `ReadinessFailure` for why.


            Distinct from `/api/health`, which ignores the drain flag: it keeps answering
            `200` right through a drain. An orchestrator should therefore take
            this pod out of service on a `503` here and leave the process
            running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessFailure" }

  /api/metrics:
    get:
      tags: [discovery]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: >-
            Prometheus text format. Also the response when the database is
            unreachable: the route does not 503. It answers `200` with the
            process-local series intact, `aitp_control_plane_db_up 0`, and the
            fixed comment `# DB unavailable: cause logged server-side,
            deliberately not published here`. The database error message is
            logged, never included in the body. Alert on `db_up`, not on a
            non-200.
          content:
            text/plain: { schema: { type: string } }

  /.well-known/aitp-manifest:
    get:
      tags: [discovery]
      summary: CP's own AITP manifest
      security: []
      responses:
        "200":
          description: >-
            Signed ManifestEnvelope JSON, with `Cache-Control: max-age=3600`.
          headers:
            Cache-Control:
              schema: { type: string, example: max-age=3600 }

  /.well-known/aitp-revocation-list:
    get:
      tags: [discovery]
      summary: Signed revocation snapshot (RFC-AITP-0008)
      security: []
      responses:
        "200":
          description: >-
            Signed RevocationListEnvelope JSON, always backed by a successful
            database read (or, only with `REVOCATION_FAIL_MODE=serve_stale`, the
            last such list re-served byte-for-byte while younger than
            `REVOCATION_MAX_STALENESS_SECS`). Carries `Cache-Control:
            max-age=60`. The list is re-read and re-signed at most every 60
            seconds per process; `REVOCATION_LIST_TTL_SECS` sets the signed
            list's `expires_at`, not the refresh rate.
          headers:
            Cache-Control:
              schema: { type: string, example: max-age=60 }
        "503":
          description: >-
            `code` is `REVOCATION_UNAVAILABLE`: the database read failed and
            policy forbids serving anything else. The CP **never** answers a
            failed read with a signed empty list, because that would assert
            "nothing is revoked". A relying party must treat this as "revocation
            status unknown", not as "not revoked". Carries `Cache-Control:
            no-store` and `Retry-After: 30`; the body is fixed and carries no
            database detail.
          headers:
            Retry-After:
              schema: { type: integer }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/enroll:
    post:
      tags: [registry]
      summary: Issue a one-time enrollment token from a signed manifest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # `required` matches POST /api/registry/agents. Without it a
              # spec-valid `{}` is a guaranteed 400 MANIFEST_INVALID, which the
              # 400 below documents — so the schema would describe a request the
              # route always rejects as acceptable.
              required: [manifest]
              properties:
                manifest: { type: object }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400":
          description: >-
            Manifest missing, malformed, expired, or failed verification.
            `code` is one of `MANIFEST_INVALID`, `MANIFEST_EXPIRED` (the
            manifest is already past `expires_at`, or expires inside the
            5-minute registration window — the same code
            `POST /api/registry/agents` returns for that identical condition),
            or `BODY_INVALID` when the body is not JSON. `MANIFEST_INVALID`
            (with no `verifyCode`) also covers a manifest the SDK accepted but
            the registry cannot store, so no token is minted for it:
            `display_name` over 256 characters (Unicode code points) or not a
            string, `aid` over 512 (or over 256 when there is no
            `display_name`, since the AID is then the stored display name), a
            NUL in `aid`, `display_name` or `handshake_endpoint`, a non-string
            `handshake_endpoint`, `offered_capabilities` that is not an
            array of NUL-free, well-formed strings, or an `expires_at` that is
            not a number of Unix seconds between years 0001 and 9999 (`0`,
            `null` or absent means no expiry). `verifyCode` is
            present when the `aitp` SDK was the thing that rejected the
            manifest — branch on it, not on `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifestVerificationError" }
        "429":
          description: Rate limited — the strict per-IP `enroll-ip` bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitError" }
        "500":
          description: >-
            An internal fault. Documented because it is reachable **by design**
            rather than only by accident: this route rethrows anything it cannot
            classify as the caller's bad manifest or a known server
            misconfiguration, so an unexpected failure surfaces as a `500`
            instead of a `400` that blames a manifest which was fine. The body
            is whatever the framework renders and is **not** the shared `Error`
            shape, which is why no schema is declared here.


            Like every `500` declared in this file, it has no `content`
            because the body cannot be described. Every other error response
            declares a schema; a new one should too, or say why it cannot.
        "503":
          description: >-
            `code` is `SERVER_MISCONFIGURED`. The server cannot issue
            enrollment tokens at all — `ENROLLMENT_SECRET` is unset or too
            short. This is an operator fault, not a problem with the submitted
            manifest, and the body carries no configuration detail. Unlike a
            `400`, it is safe to retry once the deployment is fixed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/agents:
    get:
      tags: [registry]
      summary: Discover agents by capability or AID
      security: []
      parameters:
        - name: capability
          in: query
          schema: { type: string }
        - name: aid
          in: query
          schema: { type: string }
        - name: displayName
          in: query
          schema: { type: string }
        - name: display_name
          in: query
          schema: { type: string }
          description: snake_case alias for displayName (wins when both are sent)
        - $ref: "#/components/parameters/namespace"
        - name: include_manifest
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 200, minimum: 1, maximum: 1000 }
          description: Non-numeric values fall back to the default; out-of-range values are clamped. An empty value reads as 0 and is clamped to 1, not defaulted.
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Matching agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "400":
          description: >-
            `capability`, `aid`, `displayName`/`display_name` or `namespace`
            contains a NUL (U+0000). `code` is `BAD_REQUEST`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [registry]
      summary: Register an agent with a previously-issued enrollment token
      security:
        - enrollmentToken: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - name: X-Aitp-Namespace
          in: header
          schema: { type: string, maxLength: 128 }
          description: >-
            Namespace to register into; wins over
            `manifest.extensions.namespace`. At most 128 characters (Unicode
            code points), no NUL (U+0000), else `400 BAD_REQUEST`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object }
      responses:
        "201":
          description: Registered. Emits an `agent.registered` event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400":
          description: >-
            `BODY_INVALID` when the body is not JSON, is JSON but not an object
            (`null`, an array, a string, a number), or has no `manifest.aid`
            (checked first, before the token); `BAD_REQUEST` when the
            `X-Aitp-Namespace` header is over 128 characters or contains a NUL
            (checked after the token is validated but before its `jti` is
            consumed, so the same token can be retried); `MANIFEST_EXPIRED`
            when `manifest.expires_at` is inside the 5-minute registration
            window (the same code `POST /api/registry/enroll` returns for that
            condition); `BODY_INVALID` when `manifest.extensions.namespace` is
            present but not a string, or — when no `X-Aitp-Namespace` header is
            sent — is over 128 characters or contains a NUL;
            `BODY_INVALID` when a manifest value cannot be stored —
            `display_name` (or, when absent, `aid`) over 256 characters, `aid`
            over 512, a NUL in `aid`, `display_name` or `handshake_endpoint`, a
            non-string `handshake_endpoint`, `offered_capabilities` that is
            not an array of NUL-free, well-formed strings, or an `expires_at`
            outside Unix seconds for years 0001-9999 (the rules `/enroll`
            applies before minting a token; checked after the token is
            validated but before its `jti` is consumed);
            `IDEMPOTENCY_KEY_INVALID` for a bad `Idempotency-Key`.


            Only the `MANIFEST_EXPIRED` check and the
            `manifest.extensions.namespace` check run **after** the token's
            `jti` has been consumed, so for those the token cannot be reused:
            fix the manifest and re-enroll (a retry with the same token gets
            `401 TOKEN_REPLAYED`). The `X-Aitp-Namespace` header check and the
            storable-values check run before consumption, so the token is not
            burned. A `400` is stored against an `Idempotency-Key`, so a retry
            with the same key replays it; retry with a new key or none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >-
            The enrollment token was rejected. `code` is `TOKEN_INVALID` — wrong
            scope, expired, `sub` not matching `manifest.aid`, missing `jti`,
            token not bound to the submitted manifest (its `msh` claim, the
            SHA-256 of the exact `/enroll` body bytes, is missing or differs
            from this request body's digest),
            malformed, bad signature, or an unparseable payload — or
            `TOKEN_REPLAYED`, meaning a still-valid token was presented a second
            time: the `jti` is consumed atomically on first use, so a captured
            token cannot resurrect a deregistered agent or overwrite a
            registration an operator has since changed.


            `error` names the specific reason as human-facing text. Branch on
            `code`, which distinguishes only those two cases; the prose is not a
            contract. Note that a server with no usable `ENROLLMENT_SECRET`
            answers `503`, not `401` — it cannot judge this token at all, and
            saying otherwise would blame a caller whose token was fine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Rate limited. `bucket` is `public-ip`: this path is public as far as
            the request gate is concerned — the enrollment token is checked by
            the handler, not the gate — so it shares the per-IP bucket rather
            than the per-key one, even though the request carries a bearer
            token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitError" }
        "503":
          description: >-
            `code` is `SERVER_MISCONFIGURED`. The server has no usable
            `ENROLLMENT_SECRET` and cannot verify any enrollment token —
            `POST /api/registry/enroll` reports the same fault for the same
            reason. This is an operator fault, not a problem with the submitted
            token or manifest, and the body carries no configuration detail.
            Unlike a `400` or a `401`, it is safe to retry once the deployment
            is fixed, and the token's `jti` is not consumed on this path — but
            reusing the same token only works within its 5-minute lifetime and
            only if the secret was restored rather than rotated; a new secret
            invalidates tokens minted under the old one, so the retry would get
            `401 TOKEN_INVALID` and the caller must re-enroll.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/agents/{aid}:
    parameters:
      - name: aid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      summary: Fetch one agent (summary fields)
      security: []
      responses:
        "200":
          description: "OK. Carries `Cache-Control: public, max-age=30`."
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=30" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSummary" }
        "404":
          description: No agent with this AID. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [registry]
      summary: Deregister an agent (admin)
      responses:
        "200":
          description: >-
            Deregistered — a `200` **with a body**, not a `204`.
            Deregistration is a status flip on the registry row, not a row
            deletion, and `status` reports the state the row is now in.
          content:
            application/json:
              schema:
                type: object
                required: [aid, status]
                properties:
                  aid:
                    type: string
                    description: >-
                      The AID that was deregistered — the `{aid}` path segment,
                      percent-decoded.
                  status:
                    type: string
                    const: deregistered
                    description: >-
                      The row's status after the call. Always this value on a
                      `200`; the registry's other statuses (`active`, `expired`)
                      are not reachable through this route.
        "404":
          description: >-
            No registry row with this AID, so nothing was deregistered. `code` is
            `NOT_FOUND`. It specifically does **not** mean "already
            deregistered": the row is matched on AID alone regardless of status,
            so repeating this call against an agent that is already
            `deregistered` still matches and still succeeds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/registry/agents/{aid}/manifest:
    parameters:
      - name: aid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      summary: Fetch the cached ManifestEnvelope for an agent
      security: []
      responses:
        "200": { description: ManifestEnvelope JSON }
        "404":
          description: >-
            No agent with this AID. `code` is `NOT_FOUND`. Note the `404` body is
            JSON `Error`, while the `200` body is the agent's stored
            ManifestEnvelope passed through verbatim — so a client must branch on
            status before parsing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions:
    get:
      tags: [sessions]
      summary: List handshake sessions
      description: >-
        Returns sessions newest first by creation time (ties broken by
        `sessionId`), paged with `limit` (default 200, max 1000) and `offset`.
        A NUL character in any filter is a `400 BAD_REQUEST`.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 }, description: "Non-numeric values fall back to the default; out-of-range values are clamped. An empty value reads as 0 and is clamped to 1, not defaulted." }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 }, description: "Negative or non-numeric values read as 0." }
        - name: status
          in: query
          schema: { type: string }
          description: >-
            Exact match on the stored status (`started`, `complete`, `failed`).
            Not validated — any other value matches nothing and returns an
            empty list.
        - name: runId
          in: query
          schema: { type: string }
        - name: run_id
          in: query
          schema: { type: string }
          description: snake_case alias for runId (wins when both are sent)
        - name: aid
          in: query
          schema: { type: string }
          description: Matches either side of the session.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/HandshakeSession" }
        "400":
          description: A filter contains a NUL character (`BAD_REQUEST`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [sessions]
      summary: Fetch one handshake session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionDetail" }
        "404":
          description: No handshake session with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/events:
    post:
      tags: [events]
      summary: Ingest a batch of audit events
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventIngestRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestResponse" }
        "400":
          description: >-
            `BODY_INVALID` when the body did not parse as JSON, or when its
            `events` member is present, not `null`, and not an array (a string,
            number, boolean or object — checked before the 500-event cap, so a
            long string or `{"length": 501}` is `400`, not `413`);
            `IDEMPOTENCY_KEY_INVALID` for a bad `Idempotency-Key`. A body that
            parses but is neither an array nor an object with an `events`
            member (or has `"events": null`) is **not** an error — it ingests
            zero events and answers `200`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >-
            PAYLOAD_TOO_LARGE — batch over 256 KiB on the wire (checked both
            against the declared `Content-Length` and against the bytes actually
            streamed, since the header is spoofable and omittable), more than
            500 events in one batch, or a single event payload over 64 KiB. The
            batch is rejected whole in every case; only the last of those
            carries `eventType`, naming the offending event. The per-event cap
            counts UTF-16 code units of `JSON.stringify(payload)`, not bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayloadTooLargeError" }
        "500":
          description: >-
            A genuine database fault. Three database calls can fail the
            request: the multi-row INSERT that stores the batch, and — only
            when an `Idempotency-Key` is sent — the key lookup that runs before
            the handler and the re-read of the stored response after it (a
            failure to *store* the response is logged and not fatal; the
            projections, last-seen touch and webhook steps are best-effort and
            never fail it). Malformed input does not reach a `500`: an item the
            database cannot store is dropped and reported in the `200` instead.
            A `500` is not stored against the key, so retry with the same one;
            events of the batch that were already stored come back as
            `duplicates`.
            The body is whatever the framework renders, not the shared `Error`
            shape.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/events/history:
    get:
      tags: [events]
      summary: Query persisted audit events
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: aid, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string }, description: "snake_case alias for sessionId" }
        - { name: runId, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string }, description: "snake_case alias for runId" }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }, description: "Non-numeric values fall back to the default; out-of-range values are clamped. An empty value reads as 0 and is clamped to 1, not defaulted." }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 }, description: "Malformed values fall back to 0." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  count:
                    type: integer
        "400":
          description: >-
            `code` is `FILTER_INVALID` — a filter value is unusable: `since` or
            `until` could not be parsed as a date (`error` names the filter and
            echoes the value), or `type`, `aid`, `sessionId`/`session_id` or
            `runId`/`run_id` contains a NUL (U+0000), which no stored value can
            match and the database cannot compare. Any other value of those
            text filters either matches or returns an empty result. Branch on
            `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/events/stream:
    get:
      tags: [events]
      summary: Server-Sent Events live stream (with backlog replay)
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: runId, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string }, description: "snake_case alias for runId (wins when both are sent)" }
        - { name: aid, in: query, schema: { type: string }, description: "Matches either side of the event." }
      responses:
        "200":
          headers:
            Cache-Control:
              schema: { type: string, example: "no-cache, no-transform" }
            X-Accel-Buffering:
              schema: { type: string, example: "no" }
          description: >-
            text/event-stream. The first chunk is a prelude, not an event: a
            `retry:` reconnect hint (tracking SSE_HEARTBEAT_MS, default 15000)
            followed by a `: connected` comment frame. It is sent immediately on
            connect, before the backlog replay, and is what flushes the response
            headers. Periodic `: heartbeat` comment frames follow at the same
            interval. Clients must tolerate comment frames (lines beginning ":")
            and must not assume the first frame carries data; EventSource and
            every conformant SSE parser already discard them. Events themselves
            arrive as `data: <json>` frames, with no `id:` line, so
            `Last-Event-ID` resume is not supported and a reconnect replays the
            backlog. The backlog is the process's last 100 events, filtered
            after selection (a filtered stream may replay fewer). The bus is
            in-memory and per replica: a stream sees only events ingested by
            the replica it is connected to.
          content:
            text/event-stream: { schema: { type: string } }
        "503":
          description: >-
            `code` is `SSE_CAPACITY` — `MAX_SSE_CONNECTIONS` streams are already
            open on this process; back off and retry. Carries a `Retry-After: 30`
            header. The capacity is per-process, so behind more than one replica
            a retry may land on an instance with a free slot. (A production
            server with an empty `API_KEYS` also answers `503`, with `code:
            SERVER_MISCONFIGURED`, from the request gate.)
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/revocation/entries:
    post:
      tags: [revocation]
      summary: Add a JTI to the revocation list
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationEntryRequest" }
      responses:
        "201":
          description: >-
            Added. Also returned when the `jti` was already revoked (the stored
            entry is unchanged; see `RevocationEntryResponse`). Every `201`
            emits a `tct.revoked` event and webhook delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationEntryResponse" }
        "400":
          description: >-
            `code` is one of three values. `JTI_INVALID` when `jti` is missing or
            not a version 1–5 UUID. `IDEMPOTENCY_KEY_INVALID` when an `Idempotency-Key` header
            is present but empty, over 255 characters, or contains control
            characters — this one comes from the idempotency layer and so is
            common to every endpoint accepting that header, not specific to this
            route. `BODY_INVALID` for every rejection of the body itself: not
            JSON, or JSON but not an object (`null`, an array, a string, a
            number); `reason` not a string, over 500 characters, or containing a NUL
            (U+0000); `revokedAt` unparseable or outside
            `1970-01-01T00:00:00.000Z` .. `9999-12-31T23:59:59.999Z`. See
            `RevocationEntryRequest` for the last two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: >-
            An internal fault — in practice a database one. This route rethrows
            a database error instead of answering with it, so the message (which
            names tables, columns and types) cannot reach the client. The body
            is whatever the framework renders and is **not** the shared `Error`
            shape, which is why no schema is declared here.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List webhook subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    post:
      tags: [webhooks]
      summary: Create a subscription
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreateRequest" }
      responses:
        "201":
          description: Created. The only response that returns the `secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "400":
          description: >-
            `BODY_INVALID` when the body is not JSON, is JSON but not an object
            (`null`, an array, a primitive), `url` is not a string, `secret`
            exceeds 255 characters, or `url`/`secret`/an `events` entry contains
            a NUL (U+0000);
            `URL_NOT_ALLOWED` when `url` is not a valid http(s) URL (https only
            in production), resolves to a private/loopback/link-local address,
            or is outside `WEBHOOK_URL_ALLOWLIST`; `IDEMPOTENCY_KEY_INVALID`
            for a bad `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    # There is deliberately no `get` here: `src/app/api/webhooks/[id]/route.ts`
    # exports only PATCH and DELETE, so a read-one answers 405. `GET
    # /api/webhooks` is the read surface.
    patch:
      tags: [webhooks]
      summary: Update a subscription
      description: >-
        A non-UUID `id` is `400 ID_INVALID` (also on DELETE), checked before
        the body is read. A changed `secret` is audited as `secretRotated:
        true`, never by value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdateRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookUpdated" }
        "400":
          description: >-
            `ID_INVALID` when `id` is not a UUID; `BODY_INVALID` when the body
            is not JSON, is JSON but not an object, `secret` exceeds 255
            characters, or `url`/`secret`/an `events` entry contains a NUL
            (U+0000); `URL_NOT_ALLOWED` when a supplied `url` fails the same
            guard as on create.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No webhook subscription with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    delete:
      tags: [webhooks]
      summary: Delete a subscription
      responses:
        "200":
          description: >-
            Deleted — a `200` **with a body**, not a `204`.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The `{id}` from the path, echoed back.
                  deleted:
                    type: boolean
                    const: true
                    description: >-
                      Always `true` on a `200`. A subscription that was not there
                      is a `404`, not a `200` with `false`.
        "400": { $ref: "#/components/responses/IdInvalid" }
        "404":
          description: >-
            No webhook subscription with this id, so nothing was deleted. `code`
            is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/audit:
    get:
      tags: [audit]
      summary: Admin audit log (who did what when), newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 }, description: "Non-numeric values fall back to the default; out-of-range values are clamped. An empty value reads as 0 and is clamped to 1, not defaulted." }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries, count]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAuditEntry" }
                  count:
                    type: integer
                    description: Number of entries in this page (not the total).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/dashboard/overview:
    get:
      tags: [dashboard]
      summary: Aggregate counts + recent activity
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h }, description: "Any other value falls back to 24h." }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/dashboard/agents:
    get:
      tags: [dashboard]
      summary: Per-agent metrics
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/tcts:
    get:
      tags: [tcts]
      summary: Query observed TCTs
      description: >-
        With `OBSERVED_ARTIFACT_VERIFICATION=strict`, reports whose signed
        token did not verify were never projected and so never appear here
        (docs/operations.md#observed-artifact-verification).
      parameters:
        - { name: issuer, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: audience, in: query, schema: { type: string } }
        - { name: capability, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean }, description: "If true, exclude revoked and expired" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tcts:
                    type: array
                    items: { $ref: "#/components/schemas/IssuedTct" }
        "400":
          description: >-
            `issuer`, `subject`, `audience`, `capability` or `sessionId`
            contains a NUL (U+0000). `code` is `BAD_REQUEST`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/delegations:
    get:
      tags: [delegations]
      summary: Query observed delegation chains
      description: |
        Without filters, returns recent delegations, newest first. With
        `?root_jti=`, returns the whole descendant tree rooted at that JTI
        (oldest first) via a recursive CTE, and every other filter, `limit`
        and `offset` are ignored. UUID parameters accept versions 1–5 only.
        Subject to `OBSERVED_ARTIFACT_VERIFICATION` like `/api/tcts`.
      parameters:
        - { name: root_jti, in: query, schema: { type: string, format: uuid } }
        - { name: rootJti, in: query, schema: { type: string, format: uuid }, description: "camelCase alias for root_jti (root_jti wins when both are sent)" }
        - { name: parent_jti, in: query, schema: { type: string, format: uuid } }
        - { name: parentJti, in: query, schema: { type: string, format: uuid }, description: "camelCase alias for parent_jti (parent_jti wins when both are sent)" }
        - { name: delegator, in: query, schema: { type: string } }
        - { name: delegatee, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegations:
                    type: array
                    items: { $ref: "#/components/schemas/Delegation" }
        "400":
          description: "`root_jti` or `parent_jti` is not a UUID, or `delegator`/`delegatee` contains a NUL (U+0000). `code` is `BAD_REQUEST`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/trust-anchors:
    get:
      tags: [trust]
      summary: List OIDC trust anchors
      parameters:
        - $ref: "#/components/parameters/namespace"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trustAnchors:
                    type: array
                    items: { $ref: "#/components/schemas/TrustAnchor" }
        "400":
          description: "`namespace` contains a NUL (U+0000). `code` is `BAD_REQUEST`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    post:
      tags: [trust]
      summary: Create a trust anchor
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustAnchorCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustAnchor" }
        "400":
          description: >-
            `BODY_INVALID` when the body is not JSON or not a JSON object,
            `issuerUrl` (or a non-empty `jwksUrl`) is not a string starting
            `http://` or `https://`, or a field breaks a limit in
            `TrustAnchorCreateRequest` (length, NUL); `IDEMPOTENCY_KEY_INVALID`
            for a bad `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `code` is `ALREADY_EXISTS` — an anchor with this
            `(namespace, issuerUrl)` exists. `existing.id` names it; PATCH that
            id to update.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      existing:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/trust-anchors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: >-
          A non-UUID value is `400 ID_INVALID` (syntax-only check, any UUID
          version), before the database is touched.
    get:
      tags: [trust]
      summary: Fetch one trust anchor (without `addedBy`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustAnchor" }
        "400": { $ref: "#/components/responses/IdInvalid" }
        "404":
          description: No trust anchor with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    patch:
      tags: [trust]
      summary: Update a trust anchor
      description: >-
        Applies only the fields present (a field of the wrong type is
        ignored; `namespace` is not patchable). A string `issuerUrl` and a
        non-empty `jwksUrl` must start `http://` or `https://`. Changing
        `issuerUrl` to one another anchor in the same namespace already has is
        `409 ALREADY_EXISTS`. An empty-string `jwksUrl` clears it (stored as
        `null`), like `null`. When `issuerUrl` or `jwksUrl` ACTUALLY changes,
        the cached JWKS (`jwksCachedAt` and the keyset) is cleared in the same
        update, and `GET /api/trust-anchors/{id}/jwks` answers `503
        JWKS_NOT_CACHED` until the background refresher's next pass (up to
        `JWKS_REFRESH_INTERVAL_MS`, default 15 min); the PATCH does not fetch
        the new keyset itself. A label-only edit, or resending the current
        URLs unchanged, keeps the cache. The response omits `addedBy`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuerUrl:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: At most 2048 characters and 2048 UTF-8 bytes; no NUL (U+0000).
                jwksUrl:
                  type: string
                  format: uri
                  nullable: true
                  maxLength: 2048
                  description: At most 2048 characters; no NUL. `""` or `null` clears it.
                label:
                  type: string
                  nullable: true
                  maxLength: 128
                  description: At most 128 characters (code points); no NUL.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustAnchor" }
        "400":
          description: >-
            `ID_INVALID` when `id` is not a UUID; `BODY_INVALID` when the body
            is not JSON or not a JSON object, a string `issuerUrl` or a
            non-empty `jwksUrl` does not start `http://` or `https://`, or a
            field breaks a limit above (length, NUL).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No trust anchor with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `code` is `ALREADY_EXISTS` — another anchor in this anchor's
            namespace already has the new `issuerUrl`. `existing.id` names it.
            Nothing was changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      existing:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    delete:
      tags: [trust]
      summary: Delete a trust anchor
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/IdInvalid" }
        "404":
          description: >-
            No trust anchor with this id, so nothing was deleted. `code` is
            `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/trust-anchors/{id}/jwks:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trust]
      summary: CP-cached JWKS for a trust anchor
      description: >-
        For agents in OIDC mode that cannot reach the issuer. Populated only
        by the background refresher, never by this request. Once a keyset has
        been cached, later refresh failures keep the old copy in place and it
        keeps being served with `200`. A PATCH that actually changes
        `issuerUrl` or `jwksUrl` clears it, so the old issuer's keys are never
        served for the new URLs; a refresh already in flight for the old URLs
        discards its result.
      responses:
        "200":
          description: The cached JWKS document.
          headers:
            X-JWKS-Cached-At:
              schema: { type: string }
              description: Time the keyset was cached (ISO-8601); empty string if unknown.
            Cache-Control:
              schema: { type: string, example: max-age=300 }
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { type: object } }
        "400":
          description: "`id` is not a UUID (syntax-only, any version). `code` is `ID_INVALID`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No trust anchor with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Nothing cached yet (`code` is `JWKS_NOT_CACHED`; body includes
            `issuerUrl`). Retry after `Retry-After` (60) seconds. Also answered
            after a PATCH changed `issuerUrl`/`jwksUrl`, for up to
            `JWKS_REFRESH_INTERVAL_MS` (default 15 min), until the refresher's
            next pass caches the new keyset. Persists
            indefinitely if the refresher never succeeds — issuer unreachable,
            `JWKS_REFRESH_ENABLED=false`, or an `http://` URL in production. (A
            production server with an empty `API_KEYS` also answers `503`,
            with `code: SERVER_MISCONFIGURED`, from the request gate.)
          headers:
            Retry-After: { schema: { type: integer } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      issuerUrl: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/pinned-keys:
    get:
      tags: [trust]
      summary: List pinned keys (or look up a specific (namespace, aid))
      description: With `?aid=` (and optional `?namespace=`), returns the single matching row.
      parameters:
        - $ref: "#/components/parameters/namespace"
        - { name: aid, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PinnedKey" }
                  - type: object
                    properties:
                      pinnedKeys:
                        type: array
                        items: { $ref: "#/components/schemas/PinnedKey" }
        "404":
          description: >-
            An `?aid=` lookup with no matching row in `(namespace, aid)` —
            `namespace` defaults to `default` when omitted. `code` is
            `NOT_FOUND`. Reachable **only** on the single-row lookup: without
            `?aid=` this is a list, and an empty list is a `200` with
            `pinnedKeys: []`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: "`aid` or `namespace` contains a NUL (U+0000). `code` is `BAD_REQUEST`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    post:
      tags: [trust]
      summary: Upsert a pinned key
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aid, pubkey]
              properties:
                namespace:
                  type: string
                  maxLength: 128
                  default: default
                  description: >-
                    At most 128 characters (Unicode code points), no NUL
                    (U+0000), else `400 BODY_INVALID`. A non-string or empty
                    value means `default`.
                aid:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: >-
                    At most 512 characters (Unicode code points), no NUL
                    (U+0000), else `400 BODY_INVALID`.
                pubkey:
                  type: string
                  description: Ed25519 public key, 43-character base64url
                  pattern: ^[A-Za-z0-9_-]{43}$
                label:
                  type: string
                  nullable: true
                  maxLength: 128
                  description: >-
                    Free-form operator note. `null` or omitted stores no label —
                    on an existing row, clearing the previous one (the upsert
                    replaces the row). Any other non-string type is `400
                    BODY_INVALID`. `maxLength` counts **characters**, as
                    the `varchar(128)` column does — 65 astral characters are 130
                    UTF-16 units but still 65 characters and are accepted. Must not
                    contain a NUL (U+0000), the one code point the column cannot
                    store; that is `400 BODY_INVALID`, and is not expressible in
                    JSON Schema, hence the prose. Other control characters
                    (newline, tab) are fine.
                expiresAt:
                  type: string
                  nullable: true
                  format: date-time
                  description: >-
                    Optional. Omitted or `null` means the pin never expires
                    (any other non-string type is `400 BODY_INVALID`) — and on an existing row, clears any
                    previous expiry (the upsert replaces `pubkey`, `label` and
                    `expiresAt` together).
                    Advisory: the control plane never sweeps `pinned_keys`, so
                    honouring this is the reading agent's job. Must fall between
                    `0001-01-01T00:00:00.000Z` and `9999-12-31T23:59:59.999Z`, or
                    `400 BODY_INVALID` — outside that window the value is not a
                    writable `timestamp with time zone`, and Postgres has no year
                    zero, which is why the floor is year 0001 rather than where the
                    four-digit-year serialization ends. A past instant **is**
                    allowed: it is how a pin is retired without deleting the row.
                    The bound applies to the UTC instant, not to the digits sent,
                    so `0001-01-01T00:00:00+14:00` is `0000-12-31T10:00Z` and is
                    rejected. RFC 3339 `date-time` already forbids the
                    expanded-year forms (`+010000-…`), so a spec-validating client
                    is constrained before it reaches the server.
      responses:
        "201":
          description: >-
            Upserted — `201` whether the row was created or replaced. Sending
            `null` for, or omitting, `label` or `expiresAt` on an existing row
            clears it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedKey" }
        "400":
          description: >-
            `code` is always `BODY_INVALID`, except `IDEMPOTENCY_KEY_INVALID` when
            an `Idempotency-Key` header is present but empty, over 255 characters,
            or contains control characters — that one comes from the idempotency
            layer and is common to every endpoint accepting the header, not
            specific to this route. `BODY_INVALID` covers: body not JSON, or JSON
            but not an object (`null`, an array, a string, a number); `aid`
            missing, empty, over 512 characters or containing a NUL (U+0000);
            `namespace` over 128 characters or containing a NUL; `pubkey` not
            43-character base64url; `label` neither a string nor `null`, over 128
            characters, or containing a NUL; `expiresAt` neither a string nor
            `null`, unparseable, or outside `0001-01-01T00:00:00.000Z` ..
            `9999-12-31T23:59:59.999Z`. Lengths count Unicode code points. See
            the request body for the last two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: >-
            An internal fault — in practice a database one; no caller input
            reaches it. The body is whatever the framework renders and is
            **not** the shared `Error` shape, which is why no schema is
            declared here; the database message never reaches the client.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
    delete:
      tags: [trust]
      summary: Delete a pinned key
      parameters:
        - $ref: "#/components/parameters/namespace"
        - { name: aid, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "400":
          description: "`?aid=` is missing, or `aid`/`namespace` contains a NUL (U+0000). `code` is `BAD_REQUEST`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            No pinned key for this `(namespace, aid)`, so nothing was deleted.
            `code` is `NOT_FOUND`. `namespace` defaults to `default`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/sessions/{sessionId}/export:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, enum: [json, jsonl], default: json } }
    get:
      tags: [sessions]
      summary: Export session bundle (session + events + projected TCTs)
      responses:
        "200":
          description: Bundle
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        "404":
          description: >-
            No handshake session with this id. `code` is `NOT_FOUND`, and the body
            is JSON `Error` regardless of `?format=` — the `jsonl` format applies
            to the bundle, not to the failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/sessions/{sessionId}/replay:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: since, in: query, schema: { type: string, format: date-time } }
      - { name: until, in: query, schema: { type: string, format: date-time } }
      - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 10000 } }
    get:
      tags: [sessions]
      summary: Ordered event stream for one session (offline replay)
      description: >-
        An unknown `sessionId` returns `200` with no events, not `404`.
        A malformed `limit` falls back to the default.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "400":
          description: "`since` or `until` is not a parseable date. `code` is `BAD_REQUEST`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/registry/agents/{aid}/export:
    parameters:
      - { name: aid, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, enum: [json, jsonl], default: json } }
      - { name: eventLimit, in: query, schema: { type: integer, default: 1000, maximum: 10000 } }
    get:
      tags: [registry]
      summary: Export an agent bundle (admin only — leaks audit data)
      description: |
        Admin-gated. Returns the agent's registry row, sessions they
        participated in (either side), all TCTs they issued/received,
        and the most recent N audit events touching them.
      responses:
        "200":
          description: Bundle
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        "404":
          description: >-
            No agent with this AID. `code` is `NOT_FOUND`, and the body is JSON
            `Error` regardless of `?format=` — the `jsonl` format applies to the
            bundle, not to the failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/webhooks/{id}/circuit-breaker:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: "Webhook id. Must be a UUID (else `400 ID_INVALID`); not looked up." }
    get:
      tags: [webhooks]
      summary: Get circuit-breaker snapshot for a webhook
      description: >-
        Breaker state is in-memory and per process: the snapshot reflects only
        the replica that served the request. Any UUID is accepted — an unknown
        id returns a fresh `closed` snapshot, never `404`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreakerSnapshot" }
        "400": { $ref: "#/components/responses/IdInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }

  /api/webhooks/{id}/circuit-breaker/reset:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: "Webhook id. Must be a UUID (else `400 ID_INVALID`); not looked up." }
    post:
      tags: [webhooks]
      summary: Manually reset a webhook's circuit breaker to closed
      description: >-
        Resets only the breaker held by the replica that served the request.
        Any UUID is accepted (no `404`), and every call with a UUID writes an
        admin audit entry; a non-UUID is `400 ID_INVALID` and writes none.
      responses:
        "200":
          description: Reset; returns the post-reset snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreakerSnapshot" }
        "400": { $ref: "#/components/responses/IdInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/GateMisconfigured" }
