openapi: 3.1.0
info:
  title: AITP Control Plane API
  version: 0.1.0
  description: |
    Registry, audit log, revocation list, and webhook fan-out for an AITP
    (Agent Identity Trust Protocol) deployment. See README.md and
    docs/api.md for the prose reference.

    Rate limiting: every `/api/*` route except `/api/health`, `/api/readyz`,
    and `/api/metrics` may return `429 RATE_LIMITED` with `Retry-After` and
    `X-RateLimit-*` headers. The per-path `429` responses below are only
    spelled out where limits are most likely to be hit (enrollment).
  license:
    name: See LICENSE

servers:
  - url: http://localhost:4000
    description: Local dev
  - url: https://control-plane.example.com
    description: Production placeholder

tags:
  - name: discovery
    description: Public unauth endpoints (manifest, revocation list, health, metrics)
  - name: registry
    description: Agent enrollment and discovery
  - name: events
    description: Telemetry ingestion and query
  - name: sessions
    description: Handshake session records
  - name: revocation
    description: TCT revocation
  - name: webhooks
    description: Outbound delivery subscriptions
  - name: audit
    description: Admin audit log
  - name: dashboard
    description: Aggregated JSON for consumers
  - name: tcts
    description: Observed TCTs (projected from handshake events)
  - name: delegations
    description: Observed delegation chains
  - name: trust
    description: OIDC trust anchors and pinned-key allowlist

security:
  - apiKey: []
  - {}

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key from `API_KEYS` env allowlist. Required for gated routes; unset in dev disables auth.
    enrollmentToken:
      type: http
      scheme: bearer
      description: One-time bearer issued by `POST /api/registry/enroll`. Used only on `POST /api/registry/agents`.

  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Opaque client-chosen key. Replaying the same key returns the cached response without re-running the handler.
    namespace:
      name: namespace
      in: query
      required: false
      schema:
        type: string
      description: Tenant scope filter. Omitting it returns rows across all namespaces.
    requestId:
      name: x-request-id
      in: header
      required: false
      schema:
        type: string
      description: Client-supplied request correlation ID. Echoed on the response.

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    ManifestVerificationError:
      description: >-
        The `400` body of `POST /api/registry/enroll`. Composed from `Error` so
        the two cannot drift, plus an optional `verifyCode` carrying the `aitp`
        SDK's own machine-readable reason.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            verifyCode:
              type: string
              example: signature_invalid
              description: >-
                Why manifest verification failed, as classified by the `aitp`
                SDK. Present if and only if the SDK rejected the manifest. It is
                absent whenever one of the control plane's own guards rejected it
                instead — a `manifest.aid` that is missing or does not start with
                `aid:`, or an `expires_at` inside the 5-minute registration
                window, both of which run *after* the SDK has already accepted
                the manifest — and absent on the pre-validation failures that
                never reach the SDK at all.


                **Branch on this field, not on `error`.** The SDK states that
                the code is the contract and the message wording is not, so
                `error` may be reworded in any SDK release and must be treated
                as human-facing detail only.


                Because of that, a `code` of `MANIFEST_EXPIRED` may arrive
                either with `verifyCode: expired` (the manifest was already past
                `expires_at`, so the SDK rejected it) or with no `verifyCode` at
                all (it was still valid but expires inside the 5-minute
                registration window, so this service rejected it). Both mean
                "re-issue with a longer TTL", which is why they share one `code`;
                `verifyCode` is what distinguishes them if you need to.


                Values known at the time of writing, from the `aitp` SDK's
                `verifyManifestJson` docstring: `signature_invalid`,
                `pop_failed`, `aid_mismatch`, `expired`, `version_unknown`,
                `identity_hint_malformed`, `incompatible_identity_type`,
                `malformed`.


                **This list is deliberately not an `enum`, and clients must not
                treat it as exhaustive.** The vocabulary is owned by the `aitp`
                SDK, not by this service, and it has already grown once (from
                five values to these eight). A new SDK minor may add more
                without a change to this service, and such a value will be
                passed through verbatim. Treat any unrecognized value as a
                generic "manifest verification failed".

    RateLimitError:
      description: >-
        The `429` body from the request gate. `bucket` names which limiter
        tripped, so a client can tell a per-IP limit from a per-key one and back
        off against the right dimension. See the `Retry-After`,
        `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`
        response headers for when to retry.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            bucket:
              type: string
              example: enroll-ip
              description: >-
                The rate-limit bucket that rejected the request. Currently
                `enroll-ip` (strict, per-IP), `public-ip` (per-IP) or `api-key`
                (per-key); like `verifyCode`, not an `enum` — buckets are an
                internal partitioning this service may re-cut.

    PayloadTooLargeError:
      description: >-
        The `413` body of `POST /api/events`. Composed from `Error` — same
        pattern as `RateLimitError` — plus an optional `eventType` naming the
        single event that blew the cap.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            eventType:
              type: string
              example: handshake.complete
              description: >-
                The `type` of the one event whose `payload` exceeded the
                per-event cap.


                **Present on exactly one of the four `413` paths.** The route
                rejects a batch for four distinct reasons, all carrying
                `code: PAYLOAD_TOO_LARGE`: a declared `Content-Length` over the
                batch byte cap, an actual streamed body over that same cap
                (checked on the bytes, because `Content-Length` is spoofable
                and omittable under chunked encoding), more events in one batch
                than the event-count ceiling, and a single event's `payload`
                over the per-event byte cap. Only the last of those can name an
                offender, so only it sets this field.


                Its absence therefore means "the whole batch was too big, no
                one event is to blame" — not "we do not know which". That
                follows the rule `docs/api.md` states for every optional
                machine-readable detail field on this API: absent means "not
                applicable here", never "unknown".


                Note the batch is rejected whole either way. Partial acceptance
                would force the caller to reconcile which events landed, which
                defeats the point of batching, so `eventType` is a diagnostic
                pointing at what to shrink — not a report of what was dropped
                from an otherwise-successful ingest.

    ReadinessFailure:
      description: >-
        The `503` body of `GET /api/readyz`. Deliberately **not** composed from
        `Error` and deliberately not carrying a `code`: this is a Kubernetes-style
        probe response consumed by a load balancer, not an API error handed to a
        client that would branch on a machine code. Declaring `Error` here would
        either misdescribe the route or force a `code` into it that nothing reads.


        **Exactly one of `reason` or `error` is present.** `reason` means the
        instance is unready on purpose (a drain); `error` means a readiness
        check threw. Never both, and a `503` never has neither.
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
          const: false
          description: >-
            Always `false` on a `503`, and always `true` on the `200`. A probe
            may key off this field alone and ignore the rest of the body.
        reason:
          type: string
          example: shutting_down
          description: >-
            Why the instance took itself out of rotation, when the cause is a
            deliberate state rather than a fault. Currently only
            `shutting_down` — a `SIGTERM` has been received and the LB should
            drain this pod, which stays *running* (`/api/health` deliberately
            keeps answering `200` through the drain; only readiness flips).


            Not an `enum`, and this one is expected to grow: any future
            precondition that can fail *known-ly* rather than by exception adds
            a value here. Treat an unrecognised `reason` as "not ready, for a
            reason this client need not understand".
        error:
          type: string
          description: >-
            The exception message from the readiness check that threw — today
            the database `SELECT 1`. Human-facing diagnostic text only; it has
            no stable wording and must not be parsed.

    HealthFailure:
      description: >-
        The `503` body of `GET /api/health`. Like `ReadinessFailure`, deliberately
        **not** composed from `Error` and deliberately carrying no `code`: it is a
        probe response read by an orchestrator, not an API error handed to a client
        that would branch on a machine code.


        Exactly one condition produces it — the database ping failed — so a `503`
        here means "process up, database unreachable". It is *not* a drain signal:
        this route never consults the shutdown flag that flips `/api/readyz`, so
        liveness keeps answering `200` for as long as the process is alive and the
        database is reachable. Note that this repo points its platform healthcheck
        at `/api/health` (`railway.json`), so a sustained `503` here is what fails
        a deploy's healthcheck; the drain case belongs to `/api/readyz` alone.


        The `200` body is these same four fields with `ok: true` and `db: ok` — one
        object literal, built before the status is chosen — so a probe may key off
        `ok` (or the status) alone and ignore the rest. The `200` is not declared
        separately for the same reason `/api/readyz`'s is not: the schema
        requirement this file holds itself to is about error responses.
      type: object
      required: [ok, service, aid, db]
      properties:
        ok:
          type: boolean
          const: false
          description: Always `false` on a `503`, and always `true` on the `200`.
        service:
          type: string
          const: aitp-control-plane
          description: >-
            Constant service identifier, so a shared or proxied probe path makes it
            obvious which service answered.
        aid:
          type: string
          example: "aid:pubkey:z:abc..."
          description: >-
            The control plane's own AID, read from its cached manifest. Present on
            the `503` too: it comes from process-local identity rather than from a
            query, so a database outage does not remove it. (This is also the one
            probe that touches CP identity at all — `/api/readyz` does not.)
        db:
          type: string
          const: error
          description: >-
            Always `error` on a `503` and `ok` on the `200`. The database ping is
            the only check this probe makes, which is why it is the only field that
            can disagree with `ok`.

    Agent:
      type: object
      required: [aid, displayName, handshakeEndpoint, offeredCaps, status]
      properties:
        aid: { type: string, example: "aid:pubkey:z:abc..." }
        displayName: { type: string }
        handshakeEndpoint: { type: string, format: uri }
        offeredCaps:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, expired, deregistered]
        namespace: { type: string, default: default }
        org: { type: string, nullable: true }
        cloud: { type: string, nullable: true }
        registeredAt: { type: string, format: date-time }
        lastEnrolledAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        manifestUrl: { type: string }
        agentManifestHint: { type: string, nullable: true }
        manifestJson:
          type: string
          description: Inline ManifestEnvelope JSON. Present only when `?include_manifest=true`.

    EnrollResponse:
      type: object
      required: [token, expiresIn, aid]
      properties:
        token: { type: string }
        expiresIn: { type: integer, example: 300 }
        aid: { type: string }

    AuditEvent:
      type: object
      required: [id, type, ts]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          example: handshake.complete
          description: "Examples: agent.registered, agent.expired, agent.deregistered, handshake.started, handshake.complete, handshake.failed, tct.revoked, delegation.issued, delegation.redeemed"
        ts: { type: string, format: date-time }
        aidA: { type: string, nullable: true }
        aidB: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        grants:
          type: array
          items: { type: string }
        payload: { type: object, additionalProperties: true }
        source: { type: string, nullable: true }

    EventIngestRequest:
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        - type: object
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }

    EventIngestResponse:
      type: object
      properties:
        ingested: { type: integer }

    HandshakeSession:
      type: object
      required: [sessionId, status]
      properties:
        sessionId: { type: string }
        aidA: { type: string, nullable: true }
        aidB: { type: string, nullable: true }
        status:
          type: string
          enum: [started, complete, failed]
        grants:
          type: array
          items: { type: string }
        runId: { type: string, nullable: true }
        boundary: { type: string, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    RevocationEntryRequest:
      type: object
      required: [jti]
      properties:
        jti: { type: string, format: uuid }
        reason:
          type: string
          maxLength: 500
          description: >-
            Free-form operator note. Must not contain a NUL (U+0000) — that is
            the one code point neither the `reason` column nor the `jsonb` audit
            payload can store, and it is rejected `400 BODY_INVALID`. Other
            control characters (newline, tab) are fine. Not expressible in JSON
            Schema, hence the prose.
        revokedAt:
          type: string
          format: date-time
          description: >-
            Defaults to now. Must fall between `1970-01-01T00:00:00.000Z` and
            `9999-12-31T23:59:59.999Z`, or `400 BODY_INVALID`. The two ends have
            different reasons: above the upper bound the value is not a writable
            `timestamp with time zone` at all, while below the epoch it is
            storable but cannot be republished faithfully, since the signed
            revocation list carries `revoked_at` as seconds since that epoch. The
            bound applies to the UTC instant, not to the digits sent, so
            `1970-01-01T00:00:00+01:00` is `1969-12-31T23:00Z` and is rejected.
            RFC 3339 `date-time` already forbids the expanded-year forms
            (`+010000-…`), so a spec-validating client is constrained before it
            reaches the server.

    Webhook:
      type: object
      required: [id, url, events, active]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WebhookCreateRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
          description: Empty array means "all event types"
        secret: { type: string }
        active: { type: boolean, default: true }

    IssuedTct:
      type: object
      description: >-
        A TCT observed by the control plane. Fields are the decomposed,
        format-agnostic projection of a reported `tct.issued` event. As of
        aitp/0.2 (JWS TCT migration) the source claims use JWT names —
        `issuer`/`subject`/`audience` derive from the `iss`/`sub`/`aud`
        claims — but the response shape here is unchanged.
      required: [jti, issuer, subject, audience, grants, issuedAt, revoked]
      properties:
        jti: { type: string, format: uuid }
        issuer: { type: string }
        subject: { type: string }
        audience: { type: string }
        grants:
          type: array
          items: { type: string }
        bindingCnf:
          type: string
          nullable: true
          description: >-
            Key-binding confirmation scalar. In aitp/0.2 this is the
            subject key's RFC 7638 JWK thumbprint (the `cnf.jkt` claim);
            in aitp/0.1 it was the subject's raw public key (`binding.cnf`).
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        sessionId: { type: string, nullable: true }
        revoked: { type: boolean }
        revokedAt: { type: string, format: date-time, nullable: true }

    Delegation:
      type: object
      description: >-
        A parent → child delegation observed by the control plane. As of
        aitp/0.2, `parentJti` is sourced from the grant voucher's `src_jti`
        claim (replacing aitp/0.1's `parent_jti`); the response shape is
        unchanged.
      required: [jti, parentJti, delegator, delegatee, scope, issuedAt, revoked]
      properties:
        jti: { type: string, format: uuid }
        parentJti: { type: string, format: uuid }
        delegator: { type: string }
        delegatee: { type: string }
        scope:
          type: array
          items: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedReason: { type: string, nullable: true, enum: [explicit, parent_revoked, null] }

    TrustAnchor:
      type: object
      required: [id, namespace, issuerUrl]
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, default: default }
        issuerUrl: { type: string, format: uri }
        jwksUrl: { type: string, format: uri, nullable: true }
        jwksCachedAt: { type: string, format: date-time, nullable: true }
        label: { type: string, nullable: true }
        addedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TrustAnchorCreateRequest:
      type: object
      required: [issuerUrl]
      properties:
        namespace: { type: string }
        issuerUrl: { type: string, format: uri }
        jwksUrl: { type: string, format: uri }
        label: { type: string }

    PinnedKey:
      type: object
      required: [namespace, aid, pubkey]
      properties:
        namespace: { type: string }
        aid: { type: string }
        pubkey:
          type: string
          description: Ed25519 public key, 43-character base64url
          pattern: ^[A-Za-z0-9_-]{43}$
        label: { type: string, nullable: true }
        addedBy: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CircuitBreakerSnapshot:
      type: object
      required: [state, failures, consecutiveSuccesses]
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        failures: { type: integer }
        consecutiveSuccesses: { type: integer }
        openedAt: { type: integer, nullable: true, description: Unix ms when the breaker last opened }
        nextProbeAt: { type: integer, nullable: true, description: Unix ms when the next half_open probe is allowed }

paths:
  /api/health:
    get:
      tags: [discovery]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }
        "503":
          description: >-
            The database ping failed. The process itself is up — that is what this
            probe reports — so this is "up, but cannot serve anything that needs the
            database", not a crashed instance.


            The body is **not** the shared `Error` shape and carries no `code` —
            see `HealthFailure` for why, and for the `200`'s shape, which is the
            same four fields.


            Undeclared here until #107, which is a gap worth naming: an operator
            configuring alerts from this file alone would have had no way to know
            that a non-`200` from the liveness probe is a documented, classified
            answer with a readable body rather than an unhandled fault.


            Unlike `/api/readyz`, this route does not consult the shutdown flag, so
            a drain never produces a `503` here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthFailure" }

  /api/readyz:
    get:
      tags: [discovery]
      summary: Readiness probe
      security: []
      responses:
        "200": { description: Ready }
        "503":
          description: >-
            Not ready, for one of two reasons: a `SIGTERM` has been received and
            this instance is draining itself out of rotation
            (`reason: shutting_down`), or the database ping failed (`error`
            carries the exception message). Exactly one of those two fields is
            present.


            The body is **not** the shared `Error` shape and carries no `code` —
            see `ReadinessFailure` for why.


            Distinct from `/api/health`, which is liveness: it keeps answering
            `200` right through a drain. An orchestrator should therefore take
            this pod out of service on a `503` here and leave the process
            running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessFailure" }

  /api/metrics:
    get:
      tags: [discovery]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain: { schema: { type: string } }

  /.well-known/aitp-manifest:
    get:
      tags: [discovery]
      summary: CP's own AITP manifest
      security: []
      responses:
        "200":
          description: Signed ManifestEnvelope JSON

  /.well-known/aitp-revocation-list:
    get:
      tags: [discovery]
      summary: Signed revocation snapshot (RFC-AITP-0008)
      security: []
      responses:
        "200":
          description: Signed RevocationListEnvelope JSON

  /api/registry/enroll:
    post:
      tags: [registry]
      summary: Issue a one-time enrollment token from a signed manifest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # `required` matches POST /api/registry/agents. Without it a
              # spec-valid `{}` is a guaranteed 400 MANIFEST_INVALID, which the
              # 400 below documents — so the schema would describe a request the
              # route always rejects as acceptable.
              required: [manifest]
              properties:
                manifest: { type: object }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "400":
          description: >-
            Manifest missing, malformed, expired, or failed verification.
            `code` is one of `MANIFEST_INVALID`, `MANIFEST_EXPIRED` (the
            manifest is already past `expires_at`, or expires inside the
            5-minute registration window — the same code
            `POST /api/registry/agents` returns for that identical condition),
            or `BODY_INVALID` when the body is not JSON. `verifyCode` is
            present when the `aitp` SDK was the thing that rejected the
            manifest — branch on it, not on `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManifestVerificationError" }
        "429":
          description: Rate limited — the strict per-IP `enroll-ip` bucket.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitError" }
        "500":
          description: >-
            An internal fault. Documented because it is reachable **by design**
            rather than only by accident: this route rethrows anything it cannot
            classify as the caller's bad manifest or a known server
            misconfiguration, so an unexpected failure surfaces as a `500`
            instead of a `400` that blames a manifest which was fine. The body
            is whatever the framework renders and is **not** the shared `Error`
            shape, which is why no schema is declared here.


            This is now the **only** `4xx`/`5xx` response in this file with no
            `content`, and that is the point: every other one declares a schema,
            so an absence here means the body genuinely cannot be described, not
            that nobody has written it down yet. Keep it that way — a new error
            response gets a schema, or a description saying why it cannot have
            one. (The invariant is about error responses; several `2xx`
            responses in this file still declare no `content`.)
        "503":
          description: >-
            `code` is `SERVER_MISCONFIGURED`. The server cannot issue
            enrollment tokens at all — `ENROLLMENT_SECRET` is unset or too
            short. This is an operator fault, not a problem with the submitted
            manifest, and the body carries no configuration detail. Unlike a
            `400`, it is safe to retry once the deployment is fixed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/agents:
    get:
      tags: [registry]
      summary: Discover agents by capability or AID
      security: []
      parameters:
        - name: capability
          in: query
          schema: { type: string }
        - name: aid
          in: query
          schema: { type: string }
        - name: displayName
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/namespace"
        - name: include_manifest
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Matching agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
    post:
      tags: [registry]
      summary: Register an agent with a previously-issued enrollment token
      security:
        - enrollmentToken: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
        - name: X-Aitp-Namespace
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object }
      responses:
        "201":
          description: Registered
        "400":
          description: >-
            Bad manifest. `code` is `MANIFEST_EXPIRED` when the manifest expires
            inside the 5-minute registration window — the same code
            `POST /api/registry/enroll` returns for that identical condition, so
            a client may handle it once for both routes — or `BODY_INVALID` for a
            malformed body (not JSON, no `manifest.aid`, or a non-string
            `manifest.extensions.namespace`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: >-
            The enrollment token was rejected. `code` is `TOKEN_INVALID` — wrong
            scope, expired, `sub` not matching `manifest.aid`, missing `jti`,
            malformed, bad signature, or an unparseable payload — or
            `TOKEN_REPLAYED`, meaning a still-valid token was presented a second
            time: the `jti` is consumed atomically on first use, so a captured
            token cannot resurrect a deregistered agent or overwrite a
            registration an operator has since changed.


            `error` names the specific reason as human-facing text. Branch on
            `code`, which distinguishes only those two cases; the prose is not a
            contract. Note that a server with no usable `ENROLLMENT_SECRET`
            answers `503`, not `401` — it cannot judge this token at all, and
            saying otherwise would blame a caller whose token was fine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Rate limited. `bucket` is `public-ip`: this path is public as far as
            the request gate is concerned — the enrollment token is checked by
            the handler, not the gate — so it shares the per-IP bucket rather
            than the per-key one, even though the request carries a bearer
            token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitError" }
        "503":
          description: >-
            `code` is `SERVER_MISCONFIGURED`. The server has no usable
            `ENROLLMENT_SECRET` and cannot verify any enrollment token —
            `POST /api/registry/enroll` reports the same fault for the same
            reason. This is an operator fault, not a problem with the submitted
            token or manifest, and the body carries no configuration detail.
            Unlike a `400` or a `401`, it is safe to retry once the deployment
            is fixed, and the token's `jti` is not consumed on this path — but
            reusing the same token only works within its 5-minute lifetime and
            only if the secret was restored rather than rotated; a new secret
            invalidates tokens minted under the old one, so the retry would get
            `401 TOKEN_INVALID` and the caller must re-enroll.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/agents/{aid}:
    parameters:
      - name: aid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      summary: Fetch one agent
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        "404":
          description: No agent with this AID. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [registry]
      summary: Deregister an agent (admin)
      responses:
        "200":
          description: >-
            Deregistered — a `200` **with a body**, not a `204`. This file said
            `204` until #107; the route has always answered
            `{"aid": "…", "status": "deregistered"}`, and a unit test pins both the
            status and that body, so the spec was corrected to the route rather
            than the reverse.


            The body is not redundant here the way a deleted-resource confirmation
            would be: deregistration is a status flip on the registry row, not a
            row deletion, and `status` reports the state the row is now in.


            Two of this API's four DELETEs are genuinely `204` with no body
            (`/api/trust-anchors/{id}` and `/api/pinned-keys`) and two answer `200`
            with a small confirmation body (this one and `/api/webhooks/{id}`).
            The split is a real property of the routes, not a documentation
            artefact — `docs/api.md` draws the same line — so a client cannot
            assume one shape for "DELETE on this API".
          content:
            application/json:
              schema:
                type: object
                required: [aid, status]
                properties:
                  aid:
                    type: string
                    description: >-
                      The AID that was deregistered — the `{aid}` path segment,
                      percent-decoded.
                  status:
                    type: string
                    const: deregistered
                    description: >-
                      The row's status after the call. Always this value on a
                      `200`; the registry's other statuses (`active`, `expired`)
                      are not reachable through this route.
        "404":
          description: >-
            No registry row with this AID, so nothing was deregistered. `code` is
            `NOT_FOUND`. It specifically does **not** mean "already
            deregistered": the row is matched on AID alone regardless of status,
            so repeating this call against an agent that is already
            `deregistered` still matches and still succeeds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/registry/agents/{aid}/manifest:
    parameters:
      - name: aid
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      summary: Fetch the cached ManifestEnvelope for an agent
      security: []
      responses:
        "200": { description: ManifestEnvelope JSON }
        "404":
          description: >-
            No agent with this AID. `code` is `NOT_FOUND`. Note the `404` body is
            JSON `Error`, while the `200` body is the agent's stored
            ManifestEnvelope passed through verbatim — so a client must branch on
            status before parsing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions:
    get:
      tags: [sessions]
      summary: List handshake sessions
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [started, complete, failed] }
        - name: runId
          in: query
          schema: { type: string }
        - name: aid
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/HandshakeSession" }

  /api/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [sessions]
      summary: Fetch one handshake session
      responses:
        "200": { description: OK }
        "404":
          description: No handshake session with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/events:
    post:
      tags: [events]
      summary: Ingest a batch of audit events
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventIngestRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestResponse" }
        "400":
          description: >-
            The body did not parse as JSON. `code` is `BODY_INVALID`. Note that a
            body which parses but is neither an array nor an object with an
            `events` array is **not** an error — it ingests zero events and
            answers `200`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >-
            PAYLOAD_TOO_LARGE — batch over 256 KiB on the wire (checked both
            against the declared `Content-Length` and against the bytes actually
            streamed, since the header is spoofable and omittable), more than
            500 events in one batch, or a single event payload over 64 KiB. The
            batch is rejected whole in every case; only the last of those
            carries `eventType`, naming the offending event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayloadTooLargeError" }

  /api/events/history:
    get:
      tags: [events]
      summary: Query persisted audit events
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: aid, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string }, description: "snake_case alias for sessionId" }
        - { name: runId, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string }, description: "snake_case alias for runId" }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  count:
                    type: integer
        "400":
          description: >-
            `code` is `FILTER_INVALID` — a filter value could not be parsed.
            Today that means `since` or `until`: they are the only two filters
            validated rather than passed through, so every other filter either
            matches or returns an empty result. `error` names the offending
            filter and echoes the value; branch on `code`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/events/stream:
    get:
      tags: [events]
      summary: Server-Sent Events live stream (with backlog replay)
      responses:
        "200":
          description: >-
            text/event-stream. The first chunk is a prelude, not an event: a
            `retry:` reconnect hint (tracking SSE_HEARTBEAT_MS, default 15000)
            followed by a `: connected` comment frame. It is sent immediately on
            connect, before the backlog replay, and is what flushes the response
            headers. Periodic `: heartbeat` comment frames follow at the same
            interval. Clients must tolerate comment frames (lines beginning ":")
            and must not assume the first frame carries data; EventSource and
            every conformant SSE parser already discard them. Events themselves
            arrive as `data: <json>` frames.
          content:
            text/event-stream: { schema: { type: string } }
        "503":
          description: >-
            `code` is `SSE_CAPACITY` — `MAX_SSE_CONNECTIONS` streams are already
            open on this process; back off and retry. Carries a `Retry-After: 30`
            header. The capacity is per-process, so behind more than one replica
            a retry may land on an instance with a free slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/revocation/entries:
    post:
      tags: [revocation]
      summary: Add a JTI to the revocation list
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationEntryRequest" }
      responses:
        "201": { description: Added }
        "400":
          description: >-
            `code` is one of three values. `JTI_INVALID` when `jti` is missing or
            not a UUID. `IDEMPOTENCY_KEY_INVALID` when an `Idempotency-Key` header
            is present but empty, over 255 characters, or contains control
            characters — this one comes from the idempotency layer and so is
            common to every endpoint accepting that header, not specific to this
            route. `BODY_INVALID` for every rejection of the body itself: not
            JSON; `reason` not a string, over 500 characters, or containing a NUL
            (U+0000); `revokedAt` unparseable or outside
            `1970-01-01T00:00:00.000Z` .. `9999-12-31T23:59:59.999Z`. See
            `RevocationEntryRequest` for the last two.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: >-
            An internal fault — in practice a database one, since the caller-caused
            failures above are all decided before any SQL runs. Documented because
            it is reachable **by design** rather than only by accident: this route
            rethrows a database error instead of answering with it, so the message
            (which names tables, columns and types) cannot reach the client. The
            body is whatever the framework renders and is **not** the shared
            `Error` shape, which is why no schema is declared here. This replaced
            a `500` carrying `{"error": "<postgres message>", "code":
            "INSERT_FAILED"}`; that code no longer exists.

  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List webhook subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
    post:
      tags: [webhooks]
      summary: Create a subscription
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }

  /api/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    # There is deliberately no `get` here. `src/app/api/webhooks/[id]/route.ts`
    # exports only PATCH and DELETE, so a read-one answers 405. This file declared
    # one anyway — a `200` with no schema at all, plus a `404` — until #107. No
    # handler was ever removed: that route file has exported exactly PATCH and
    # DELETE in every commit of its history, while `docs/api.md`'s webhook table
    # listed only the routes that exist.
    #
    # Adding one is a feature, not a doc fix, so it does not belong here until the
    # route exists: `GET /api/webhooks` is the read surface today, and the row
    # carries a `secret` that the collection response deliberately does not
    # project, so a single-row read has to decide what it exposes first.
    patch:
      tags: [webhooks]
      summary: Update a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreateRequest" }
      responses:
        "200": { description: Updated }
        "404":
          description: No webhook subscription with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [webhooks]
      summary: Delete a subscription
      responses:
        "200":
          description: >-
            Deleted — a `200` **with a body**, not a `204`. This file said `204`
            until #107; the route has always answered
            `{"id": "…", "deleted": true}`, and a unit test pins both the status
            and that body. A `204` would be the more conventional answer for a
            real row deletion, which this is — but the body is the shipped
            contract and a client may be reading it, so the spec was corrected to
            the route rather than the route changed to the spec.


            Two of this API's four DELETEs are genuinely `204` with no body
            (`/api/trust-anchors/{id}` and `/api/pinned-keys`) and two answer `200`
            with a small confirmation body (this one and
            `/api/registry/agents/{aid}`). The split is a real property of the
            routes, not a documentation artefact — `docs/api.md` draws the same
            line — so a client cannot assume one shape for "DELETE on this API".
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The `{id}` from the path, echoed back.
                  deleted:
                    type: boolean
                    const: true
                    description: >-
                      Always `true` on a `200`. A subscription that was not there
                      is a `404`, not a `200` with `false`.
        "404":
          description: >-
            No webhook subscription with this id, so nothing was deleted. `code`
            is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/audit:
    get:
      tags: [audit]
      summary: Admin audit log (who did what when)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: OK }

  /api/dashboard/overview:
    get:
      tags: [dashboard]
      summary: Aggregate counts + recent activity
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200": { description: OK }

  /api/dashboard/agents:
    get:
      tags: [dashboard]
      summary: Per-agent metrics
      responses:
        "200": { description: OK }

  /api/tcts:
    get:
      tags: [tcts]
      summary: Query observed TCTs
      parameters:
        - { name: issuer, in: query, schema: { type: string } }
        - { name: subject, in: query, schema: { type: string } }
        - { name: audience, in: query, schema: { type: string } }
        - { name: capability, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean }, description: "If true, exclude revoked and expired" }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tcts:
                    type: array
                    items: { $ref: "#/components/schemas/IssuedTct" }

  /api/delegations:
    get:
      tags: [delegations]
      summary: Query observed delegation chains
      description: |
        Without filters, returns recent delegations. With `?root_jti=`,
        walks the descendant tree rooted at that JTI via a recursive
        CTE.
      parameters:
        - { name: root_jti, in: query, schema: { type: string, format: uuid } }
        - { name: parent_jti, in: query, schema: { type: string, format: uuid } }
        - { name: delegator, in: query, schema: { type: string } }
        - { name: delegatee, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegations:
                    type: array
                    items: { $ref: "#/components/schemas/Delegation" }

  /api/trust-anchors:
    get:
      tags: [trust]
      summary: List OIDC trust anchors
      parameters:
        - $ref: "#/components/parameters/namespace"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trustAnchors:
                    type: array
                    items: { $ref: "#/components/schemas/TrustAnchor" }
    post:
      tags: [trust]
      summary: Create a trust anchor
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustAnchorCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustAnchor" }
        "409":
          description: Duplicate (namespace, issuerUrl)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/trust-anchors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [trust]
      summary: Fetch one trust anchor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrustAnchor" }
        "404":
          description: No trust anchor with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [trust]
      summary: Update a trust anchor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuerUrl: { type: string, format: uri }
                jwksUrl: { type: string, format: uri, nullable: true }
                label: { type: string, nullable: true }
      responses:
        "200": { description: Updated }
        "404":
          description: No trust anchor with this id. `code` is `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [trust]
      summary: Delete a trust anchor
      responses:
        "204": { description: Deleted }
        "404":
          description: >-
            No trust anchor with this id, so nothing was deleted. `code` is
            `NOT_FOUND`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/pinned-keys:
    get:
      tags: [trust]
      summary: List pinned keys (or look up a specific (namespace, aid))
      description: With `?aid=` (and optional `?namespace=`), returns the single matching row.
      parameters:
        - $ref: "#/components/parameters/namespace"
        - { name: aid, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PinnedKey" }
                  - type: object
                    properties:
                      pinnedKeys:
                        type: array
                        items: { $ref: "#/components/schemas/PinnedKey" }
        "404":
          description: >-
            An `?aid=` lookup with no matching row in `(namespace, aid)` —
            `namespace` defaults to `default` when omitted. `code` is
            `NOT_FOUND`. Reachable **only** on the single-row lookup: without
            `?aid=` this is a list, and an empty list is a `200` with
            `pinnedKeys: []`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [trust]
      summary: Upsert a pinned key
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aid, pubkey]
              properties:
                namespace: { type: string }
                aid: { type: string }
                pubkey:
                  type: string
                  description: Ed25519 public key, 43-character base64url
                  pattern: ^[A-Za-z0-9_-]{43}$
                label: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        "201":
          description: Upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedKey" }
    delete:
      tags: [trust]
      summary: Delete a pinned key
      parameters:
        - $ref: "#/components/parameters/namespace"
        - { name: aid, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404":
          description: >-
            No pinned key for this `(namespace, aid)`, so nothing was deleted.
            `code` is `NOT_FOUND`. A missing `?aid=` is a `400 BAD_REQUEST`
            instead, not a `404`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sessionId}/export:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, enum: [json, jsonl], default: json } }
    get:
      tags: [sessions]
      summary: Export session bundle (session + events + projected TCTs)
      responses:
        "200":
          description: Bundle
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        "404":
          description: >-
            No handshake session with this id. `code` is `NOT_FOUND`, and the body
            is JSON `Error` regardless of `?format=` — the `jsonl` format applies
            to the bundle, not to the failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/sessions/{sessionId}/replay:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
      - { name: since, in: query, schema: { type: string, format: date-time } }
      - { name: until, in: query, schema: { type: string, format: date-time } }
      - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 10000 } }
    get:
      tags: [sessions]
      summary: Ordered event stream for one session (offline replay)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }

  /api/registry/agents/{aid}/export:
    parameters:
      - { name: aid, in: path, required: true, schema: { type: string } }
      - { name: format, in: query, schema: { type: string, enum: [json, jsonl], default: json } }
      - { name: eventLimit, in: query, schema: { type: integer, default: 1000, maximum: 10000 } }
    get:
      tags: [registry]
      summary: Export an agent bundle (admin only — leaks audit data)
      description: |
        Admin-gated. Returns the agent's registry row, sessions they
        participated in (either side), all TCTs they issued/received,
        and the most recent N audit events touching them.
      responses:
        "200":
          description: Bundle
          content:
            application/json: { schema: { type: object } }
            application/x-ndjson: { schema: { type: string } }
        "404":
          description: >-
            No agent with this AID. `code` is `NOT_FOUND`, and the body is JSON
            `Error` regardless of `?format=` — the `jsonl` format applies to the
            bundle, not to the failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/webhooks/{id}/circuit-breaker:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [webhooks]
      summary: Get circuit-breaker snapshot for a webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreakerSnapshot" }

  /api/webhooks/{id}/circuit-breaker/reset:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [webhooks]
      summary: Manually reset a webhook's circuit breaker to closed
      responses:
        "200":
          description: Reset; returns the post-reset snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CircuitBreakerSnapshot" }
